<section id="now" aria-labelledby="now-title">
    <div class="section-head">
        <h2 id="now-title"><span lang="en">Projects at a glance</span><span lang="de">Projekte im Überblick</span></h2>
    </div>
    <div class="figures" data-stats="projects"></div>

    <div class="contrib" data-activity="panel" hidden>
        <div class="contrib-head">
            <span class="contrib-title"><span lang="en">GitHub contributions, last 12 months</span><span lang="de">GitHub-Beiträge, letzte 12 Monate</span></span>
            <span class="contrib-summary" data-activity="summary"></span>
        </div>
        <div class="contrib-scroll">
            <div class="contrib-tip" data-activity="tip" role="status" hidden></div>
            <div class="contrib-months" data-activity="months" aria-hidden="true"></div>
            <div class="contrib-grid" data-activity="grid" role="img"></div>
        </div>
        <div class="contrib-legend" aria-hidden="true">
            <span lang="en">Less</span><span lang="de">Weniger</span>
            <i data-level="0"></i><i data-level="1"></i><i data-level="2"></i><i data-level="3"></i><i data-level="4"></i>
            <span lang="en">More</span><span lang="de">Mehr</span>
        </div>
    </div>
</section>
